backend:
  name: git-gateway
  branch: main

locale: "vi"
site_url: "https://lyhoangmakeup.com"
display_url: "https://lyhoangmakeup.com"
media_folder: "media"
public_folder: "/media"

collections:
  - name: "trang_chu"
    label: "Trang chủ (chữ, ảnh, video, bố cục)"
    files:
      - name: "trang_chu"
        label: "Trang chủ"
        file: "data/home.json"
        fields:
          - { label: "Slogan (tiêu đề lớn)", name: "hero_title", widget: "text", required: false }
          - { label: "Mô tả dưới slogan", name: "hero_desc", widget: "text", required: false }
          - { label: "Chữ nút 1", name: "btn_book_text", widget: "string", required: false }
          - { label: "Chữ nút 2", name: "btn_course_text", widget: "string", required: false }

  - name: "blog"
    label: "Bài viết Blog"
    folder: "data/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Tiêu đề", name: "title", widget: "string" }
      - { label: "Mô tả ngắn", name: "description", widget: "text", required: false }
      - { label: "Ảnh bìa", name: "thumbnail", widget: "image", required: false }
      - { label: "Nội dung", name: "body", widget: "markdown", required: false }

  - name: "cua_hang"
    label: "Cửa hàng (Sản phẩm)"
    files:
      - name: "cua_hang"
        label: "Danh sách sản phẩm"
        file: "data/shop.json"
        fields:
          - { label: "Sản phẩm", name: "products", widget: "list", required: false, summary: "{{fields.code}} · {{fields.name}}", fields: [
              { label: "Mã SP", name: "code", widget: "string", required: false },
              { label: "Tên sản phẩm", name: "name", widget: "string" },
              { label: "Địa chỉ trang (slug)", name: "slug", widget: "string", required: false },
              { label: "Ngành hàng", name: "category", widget: "select", options: ["Trang điểm", "Chăm sóc da", "Phụ kiện tóc", "Nước hoa"], default: "Trang điểm" },
              { label: "Hiện trên website", name: "published", widget: "boolean", default: true },
              { label: "Giá bán (VNĐ)", name: "price", widget: "number", value_type: "int", min: 0, required: false },
              { label: "Mô tả ngắn", name: "short_desc", widget: "text", required: false },
              { label: "Ảnh sản phẩm", name: "images", widget: "list", required: false, fields: [
                  { label: "Ảnh", name: "image", widget: "image" },
                  { label: "Mô tả alt", name: "alt", widget: "string", required: false } ] },
              { label: "Video sản phẩm", name: "video", widget: "file", required: false },
              { label: "Vì sao Lý Hoàng dùng", name: "reason", widget: "text", required: false },
              { label: "Cách dùng", name: "usage", widget: "text", required: false } ] }

  - name: "lookbook"
    label: "Lookbook (Kho ảnh)"
    files:
      - name: "lookbook"
        label: "Lookbook"
        file: "data/look.json"
        fields:
          - { label: "Nhóm ảnh", name: "categories", widget: "list", required: false, summary: "{{fields.title}}", fields: [{ label: "Tên nhóm", name: "title", widget: "string" }, { label: "Ảnh", name: "images", widget: "list", required: false, field: { label: "Ảnh", name: "image", widget: "image" } }] }

  - name: "thong_tin"
    label: "Thông tin chung"
    files:
      - name: "thong_tin"
        label: "Cấu hình chung"
        file: "data/site.json"
        fields:
          - { label: "Tên thương hiệu", name: "brand_name", widget: "string", required: false }
          - { label: "Hotline", name: "hotline_display", widget: "string", required: false }
          - { label: "Địa chỉ", name: "address", widget: "string", required: false }