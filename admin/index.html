<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex"><title>Quản trị Lý Hoàng Makeup</title>

</head>
<body><!-- LY-BLOG-V2 -->
<script>window.CMS_MANUAL_INIT=true;</script>
<script src="https://unpkg.com/decap-cms@3.9.0/dist/decap-cms.js"></script>
<script src="/admin/blog-manager.js?v=20261024-blog2"></script>
<script>window.initCMS();</script>

<script>
/* Hỏi đặt tên file (không dấu, có từ khóa) mỗi khi tải ảnh/video lên trang quản trị */
(function(){
function slug(s){return String(s||'').toLowerCase().replace(/đ/g,'d').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}
document.addEventListener('change',function(e){
var i=e.target;if(!i||i.type!=='file'||!i.files||!i.files.length||typeof DataTransfer==='undefined')return;
var dt=new DataTransfer(),changed=false;
Array.prototype.forEach.call(i.files,function(f){
if(!/^(image|video)\//.test(f.type)){dt.items.add(f);return}
var m=f.name.match(/\.([a-z0-9]+)$/i),ext=m?m[1].toLowerCase():'',base=f.name.replace(/\.[a-z0-9]+$/i,'');
var n=window.prompt('Đặt tên file cho SEO: viết không dấu, nối bằng gạch ngang.\nVí dụ: trang-diem-co-dau-mat-tron-ly-hoang-makeup-bien-hoa-dong-nai\n(Bấm Hủy để giữ tên gốc)',slug(base));
if(n===null||!slug(n)){dt.items.add(f);return}
dt.items.add(new File([f],slug(n)+(ext?'.'+ext:''),{type:f.type,lastModified:f.lastModified}));changed=true});
if(changed)i.files=dt.files},true);
})();
</script>

<!-- Thư viện SheetJS xử lý Excel trực tiếp trên trình duyệt -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

<!-- 1. THANH CÔNG CỤ EXCEL: CHỈ HIỆN KHI Ở MỤC CỬA HÀNG -->
<div id="excel-admin-bar" style="position:fixed; bottom:20px; right:20px; z-index:99999; background:#1e1e2f; color:#fff; padding:12px 16px; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,0.25); font-family:sans-serif; display:none; gap:10px; align-items:center; font-size:13px;">
  <strong style="color:#f5c542;">⚡ Quản lý SP bằng Excel:</strong>
  <button id="btn-export-excel" style="background:#28a745; color:#fff; border:none; padding:7px 12px; border-radius:6px; cursor:pointer; font-weight:600;">
    📥 Xuất Excel
  </button>
  <label style="background:#007bff; color:#fff; padding:7px 12px; border-radius:6px; cursor:pointer; font-weight:600; margin:0;">
    📤 Nhập Excel
    <input type="file" id="input-import-excel" accept=".xlsx,.xls" style="display:none;" />
  </label>
</div>

<!-- Tìm nhanh trong các danh sách nội dung đang mở -->
<div id="content-search-bar" style="position:fixed;top:16px;right:18px;z-index:99999;display:none;gap:6px;align-items:center;background:#fffdf6;color:#2a2112;padding:8px 10px;border:1px solid #d9b64a;border-radius:12px;box-shadow:0 5px 18px #0002;font:13px sans-serif">
  <strong>🔎 Tìm nhanh</strong>
  <input id="content-search-input" type="search" placeholder="Tên, ngành, hashtag..." style="width:210px;margin:0;padding:7px 10px;border:1px solid #d9d0ba;border-radius:8px">
  <button id="content-search-next" type="button" style="background:#8a6410;color:white;border:0;border-radius:8px;padding:8px 10px;cursor:pointer">Tìm tiếp</button>
</div>

<!-- 2. THANH CÔNG CỤ VIẾT BÀI NHANH: CHỈ HIỆN KHI Ở MỤC BLOG -->
<div id="blog-admin-bar" style="position:fixed; bottom:20px; right:20px; z-index:99999; background:#1e1e2f; color:#fff; padding:12px 16px; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,0.25); font-family:sans-serif; display:none; gap:10px; align-items:center; font-size:13px;">
  <strong style="color:#f5c542;">📝 Trợ lý Blog:</strong>
  <button id="btn-quick-add-blog" style="background:#d9b64a; color:#1e1e2f; border:none; padding:8px 14px; border-radius:6px; cursor:pointer; font-weight:700;">
    ✍️ + Viết bài Blog mới ngay
  </button>
  <button id="btn-collapse-blog" style="background:#3a3a52; color:#fff; border:none; padding:8px 12px; border-radius:6px; cursor:pointer; font-weight:600;" title="Thu gọn hoặc mở rộng danh sách bài viết">
    📁 Thu gọn / Mở rộng
  </button>
</div>

<script>
// Tự động kiểm tra trang hiện tại trong Admin để chỉ hiển thị đúng nút cần thiết
function updateAdminFloatingBars() {
  const h = window.location.hash || '';
  const excelBar = document.getElementById('excel-admin-bar');
  const blogBar = document.getElementById('blog-admin-bar');
  const searchBar = document.getElementById('content-search-bar');

  // Chỉ hiện nút Excel khi người dùng đang mở trang chỉnh sửa Cửa hàng (cua_hang)
  const isShopPage = h.includes('/collections/cua_hang/entries/');
  // Chỉ hiện nút Viết bài nhanh khi người dùng đang mở trang chỉnh sửa Blog (blog)
  const isBlogPage = h.includes('/collections/blog/entries/');
  const isLookPage = h.includes('/collections/lookbook_anh/entries/') || h.includes('/collections/lookbook_video/entries/');
  if (searchBar) searchBar.style.display = (isShopPage || isBlogPage || isLookPage) ? 'flex' : 'none';

  if (excelBar) excelBar.style.display = isShopPage ? 'flex' : 'none';
  if (blogBar) blogBar.style.display = isBlogPage ? 'flex' : 'none';
}

document.getElementById('content-search-next').addEventListener('click', () => {
  const q = (document.getElementById('content-search-input').value || '').trim();
  if (!q) { document.getElementById('content-search-input').focus(); return; }
  const found = window.find(q, false, false, true, false, false, false);
  if (!found) alert('Chưa thấy nội dung này trong danh sách đang mở. Hãy thử tên rút gọn hoặc một hashtag.');
});
document.getElementById('content-search-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('content-search-next').click();
});

window.addEventListener('hashchange', updateAdminFloatingBars);
setInterval(updateAdminFloatingBars, 600);
updateAdminFloatingBars();

// Nút "+ Viết bài Blog mới ngay": Tự động bấm nút Add, cuộn thẳng tới khung soạn thảo bài mới
document.getElementById('btn-quick-add-blog').addEventListener('click', () => {
  const buttons = Array.from(document.querySelectorAll('button, a, div[role="button"]'));
  const addBtn = buttons.find(el => {
    const txt = (el.textContent || '').trim().toLowerCase();
    return txt.includes('add bài viết') || txt.includes('thêm bài viết') || (txt.startsWith('add ') && txt.includes('bài'));
  });

  if (addBtn) {
    addBtn.click();
    setTimeout(() => {
      // Tìm tất cả các ô nhập Tiêu đề đang mở và cuộn tới ô mới nhất
      const inputs = Array.from(document.querySelectorAll('input[type="text"]')).filter(inp => inp.offsetParent !== null);
      if (inputs.length > 0) {
        const targetInput = inputs[inputs.length - 1];
        targetInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
        setTimeout(() => targetInput.focus(), 300);
      } else {
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      }
    }, 250);
  } else {
    alert('Đang tải danh sách bài viết, anh vui lòng đợi 1 giây rồi bấm lại nhé!');
  }
});

// Nút "Thu gọn / Mở rộng" danh sách bài viết trong Admin
document.getElementById('btn-collapse-blog').addEventListener('click', () => {
  const toggleBtns = Array.from(document.querySelectorAll('button[aria-label*="collapse"], button[aria-label*="expand"], [class*="TopBarButton"]'));
  if (toggleBtns.length > 0) {
    toggleBtns.forEach(b => b.click());
  } else {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
});

// 1. XUẤT FILE EXCEL CỬA HÀNG
document.getElementById('btn-export-excel').addEventListener('click', async () => {
  try {
    const res = await fetch('/data/shop.json?t=' + Date.now());
    const data = await res.json();
    const rows = (data.products || []).map(p => ({
      'Mã SP': p.code || '',
      'Tên sản phẩm': p.name || '',
      'Slug': p.slug || '',
      'Ngành hàng': p.category || 'Trang điểm',
      'Phân loại con': p.subcategory || '',
      'Hiện trên web (TRUE/FALSE)': p.published !== false,
      'Giá bán (VNĐ)': p.price !== undefined && p.price !== null ? p.price : '',
      'Mô tả ngắn': p.short_desc || '',
      'Mô tả chi tiết (Markdown)': p.long_desc || '',
      'Danh sách Ảnh': (p.images || []).map(i => i.image).join(', '),
      'Video': p.video || '',
      'Đã kiểm duyệt (TRUE/FALSE)': Boolean(p.content_approved),
      'Vì sao Lý Hoàng dùng': p.reason || '',
      'Cách dùng': p.usage || ''
    }));

    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'San_Pham');
    XLSX.writeFile(wb, 'Danh_sach_san_pham_LyHoang.xlsx');
  } catch (err) {
    alert('Lỗi xuất Excel: ' + err.message);
  }
});

// 2. NHẬP FILE EXCEL -> TẢI SHOP.JSON MỚI
document.getElementById('input-import-excel').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf);
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });

    const products = rows.map(r => {
      const name = String(r['Tên sản phẩm'] || '').trim();
      const rawPrice = r['Giá bán (VNĐ)'];
      const price = rawPrice !== '' && rawPrice !== undefined ? parseInt(String(rawPrice).replace(/[^0-9]/g, ''), 10) : null;
      const imgs = String(r['Danh sách Ảnh'] || '')
        .split(',').map(s => s.trim()).filter(Boolean)
        .map(img => ({ image: img, alt: name + ' do Lý Hoàng Makeup chọn dùng' }));

      return {
        code: String(r['Mã SP'] || '').trim(),
        name,
        slug: String(r['Slug'] || '').trim(),
        category: String(r['Ngành hàng'] || 'Trang điểm').trim(),
        subcategory: String(r['Phân loại con'] || '').trim(),
        published: String(r['Hiện trên web (TRUE/FALSE)']).toLowerCase() !== 'false',
        ...(price !== null && !isNaN(price) ? { price } : {}),
        short_desc: String(r['Mô tả ngắn'] || '').trim(),
        long_desc: String(r['Mô tả chi tiết (Markdown)'] || '').trim(),
        images: imgs,
        ...(r['Video'] ? { video: String(r['Video']).trim() } : {}),
        content_approved: String(r['Đã kiểm duyệt (TRUE/FALSE)']).toLowerCase() === 'true',
        reason: String(r['Vì sao Lý Hoàng dùng'] || '').trim(),
        usage: String(r['Cách dùng'] || '').trim()
      };
    }).filter(p => p.name);

    const jsonStr = JSON.stringify({ products }, null, 2);
    const blob = new Blob([jsonStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'shop.json';
    a.click();
    alert(`✅ Đã tạo file shop.json với ${products.length} sản phẩm!\nChép đè file này vào thư mục data/ trên máy và chạy Git để cập nhật.`);
  } catch (err) {
    alert('Lỗi nhập Excel: ' + err.message);
  }
  e.target.value = '';
});
</script>
