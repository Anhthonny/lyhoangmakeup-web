function md(s){s=String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
var inl=x=>x.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\[(.+?)\]\((.+?)\)/g,'<a class="gold" href="$2">$1</a>');
return s.split(/\n{2,}/).map(b=>{b=b.trim();if(!b)return'';var h=b.match(/^(#{1,3}) (.*)/);if(h){var l=h[1].length+1;return`<h${l} style="font-size:${l==2?24:20}px;margin-top:28px">${inl(h[2])}</h${l}>`}
if(/^[-*] /.test(b))return'<ul>'+b.split('\n').map(x=>`<li>${inl(x.replace(/^[-*] /,''))}</li>`).join('')+'</ul>';
var im=b.match(/^!\[(.*?)\]\((.*?)\)/);if(im)return`<img class="im im16" src="${im[2]}" alt="${im[1]}" style="margin:16px 0">`;
return`<p>${inl(b).replace(/\n/g,'<br>')}</p>`}).join('')}
