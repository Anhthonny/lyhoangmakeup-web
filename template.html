/* --- Giao diện Blog Luxury Editorial --- */
.blog-hero { text-align: center; max-width: 720px; margin: 0 auto 28px; }
.blog-hero h1 { font-size: clamp(30px, 4.2vw, 44px); margin: 0 0 10px; line-height: 1.2; letter-spacing: -0.01em; }
.blog-hero p { font-size: 15.5px; color: var(--mute); margin: 0; line-height: 1.6; }

.blog-toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin: 0 0 18px; padding-bottom: 16px; border-bottom: 1px solid rgba(217,182,74,0.22); }
.blog-cats { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.blog-cat-pill { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 500; text-decoration: none; color: #3a3028; background: #fff; border: 1px solid rgba(217,182,74,0.35); transition: all .2s ease; white-space: nowrap; }
.blog-cat-pill:hover { border-color: #c9a227; color: #1a1410; transform: translateY(-1px); }
.blog-cat-pill.active { background: linear-gradient(135deg, #d9b64a, #b88917); color: #fff; border-color: transparent; font-weight: 600; box-shadow: 0 4px 14px rgba(184,137,23,0.25); }
.blog-cat-pill span.cnt { font-size: 11.5px; opacity: 0.82; font-weight: 400; }

.blog-search-wrap { position: relative; min-width: 240px; flex: 0 1 260px; }
.blog-search-wrap input { width: 100% !important; margin: 0 !important; padding: 9px 14px 9px 34px !important; border-radius: 999px !important; border: 1px solid rgba(217,182,74,0.38) !important; background: #fff !important; font-size: 13.5px !important; outline: none; transition: border-color .2s, box-shadow .2s; }
.blog-search-wrap input:focus { border-color: #b88917 !important; box-shadow: 0 0 0 3px rgba(217,182,74,0.16); }
.blog-search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 13px; color: #8c7b6b; pointer-events: none; }

.blog-subbar { display: flex; gap: 8px; align-items: center; overflow-x: auto; padding: 4px 2px 14px; margin-bottom: 12px; scrollbar-width: none; }
.blog-subbar::-webkit-scrollbar { display: none; }
.blog-sub-chip { width: auto !important; flex: 0 0 auto; padding: 6px 13px; border-radius: 999px; font-size: 12.5px; background: rgba(217,182,74,0.09); color: var(--mute); border: 1px solid transparent; cursor: pointer; transition: all .18s ease; white-space: nowrap; }
.blog-sub-chip:hover { background: rgba(217,182,74,0.18); color: #1f1914; }
.blog-sub-chip.active { background: #231c16; color: #f6e3a4; border-color: #231c16; font-weight: 500; }

#bg { display: grid !important; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)) !important; gap: 26px !important; width: 100% !important; margin-top: 10px; }
#bg .bpost { opacity: 1 !important; visibility: visible !important; transform: none !important; background: #fff !important; border: 1px solid rgba(217,182,74,0.22) !important; border-radius: 20px !important; padding: 0 !important; overflow: hidden !important; box-shadow: 0 8px 24px rgba(28,22,16,0.04) !important; transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease !important; display: flex; flex-direction: column; justify-content: space-between; }
#bg .bpost:hover { transform: translateY(-5px) !important; box-shadow: 0 16px 36px rgba(28,22,16,0.1) !important; border-color: rgba(217,182,74,0.55) !important; }
#bg .bpost .bpost-img-wrap { display: block; overflow: hidden; aspect-ratio: 16 / 10; background: #f5efe6; position: relative; }
#bg .bpost .bpost-img-wrap img { width: 100%; height: 100%; object-fit: cover; object-position: center 25%; display: block; transition: transform .45s ease; border-radius: 0 !important; }
#bg .bpost:hover .bpost-img-wrap img { transform: scale(1.04); }
#bg .bpost .bpost-body { padding: 20px 22px 22px; flex: 1; display: flex; flex-direction: column; }
#bg .bpost .bpost-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.05em; color: #9a7b2c; font-weight: 600; margin-bottom: 8px; }
#bg .bpost .bpost-title { font-size: 18.5px; line-height: 1.42; margin: 0 0 10px; font-weight: 600; color: #1f1914; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
#bg .bpost .bpost-title a { color: inherit; text-decoration: none; transition: color .18s; }
#bg .bpost:hover .bpost-title a { color: #9a7b2c; }
#bg .bpost .bpost-desc { font-size: 14px; line-height: 1.6; color: #665c52; margin: 0 0 16px; flex: 1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
#bg .bpost .bpost-foot { display: flex; align-items: center; justify-content: space-between; padding-top: 12px; border-top: 1px solid rgba(217,182,74,0.15); font-size: 13px; font-weight: 600; color: #9a7b2c; }

/* ===== TRANG CHỦ: giao diện editorial sang trọng (class hx-*) ===== */
.hx{padding:clamp(48px,7vw,96px) 5vw}.hx-alt{background:var(--bg2)}.hx-in{max-width:1180px;margin:0 auto}

      '<h3 style="margin-top:0">'+(ok?(hv?'Đã gửi đăng ký tư vấn 🌿':'Đã gửi thông tin đặt lịch ✨'):'Chưa gửi tự động được 🙏')+'</h3>'+

        '<a class="btn b2" href="'+msg+'" target="_blank" rel="noopener">📘 Gửi qua Messenger</a>'+
      '</div></div>';

    .then(function(r){show(r.ok)}).catch(function(){show(false)});
  return false;
};

ặt → đánh thử kiểm tra độ bền nền → chọn dáng mi, màu mắt, son → chụp ảnh, lưu file màu để ngày cưới thực hiện chuẩn 100%.", "travel_title": "Di chuyển & cọc", "travel_text": "Miễn phí trong 5km, từ km thứ 6 phụ thu 10k/km; phụ thu 50k nếu trước 6h sáng. Cọc cô dâu 500k, tiệc 100k; đổi ngày báo trước 3 ngày.", "party_title": "Tiệc & Sự kiện", "party": [{"name": "Đi tiệc tại tiệm", "price": "300.000đ"}, {"name": "Đi tiệc tại nhà", "price": "350.000đ"}, {"name": "Theo layout yêu cầu", "price": "400.000đ"}, {"name": "Kỷ yếu / Chụp ảnh", "price": "350.000đ"}, {"name": "Chủ tiệc", "price": "500.000đ"}, {"name": "Lens", "price": "100.000đ"}], "party_note": "Cọc 100k giữ lịch. Gồm làm tóc hoàn chỉnh.", "kyyeu_price": "350.000đ", "academy_price": "1.700.000đ", "academy_note": "Cọc 500.000đ · 5 buổi (2–3h) · ca sáng 10h–13h hoặc tối 18h–20h30, Thứ 2–6. Mỹ phẩm hỗ trợ tại lớp, tặng 3 kiểu tóc cá nhân."}, "blog": [{"title": "Kỹ Thuật Trang Điểm Cô Dâu Mặt Tròn: Bí Quyết Thon Gọn Tự Nhiên", "description": "Cách tạo khối cốt tướng và phối kiểu tóc giúp nàng dâu tỏa sáng ngày cưới.", "thumbnail": "anh/makeup-ao-dai-hong-toc-xoan-vang-bien-hoa.webp", "body": "Mặt tròn không cần che giấu, chỉ cần tạo khối khéo để gương mặt trông thon gọn mà vẫn tự nhiên.\n\n## Tạo khối đúng chỗ\n\nĐánh khối nhẹ dọc hai bên má và quanh sống mũi, tán thật mềm để không lộ vệt. Tránh đánh khối quá đậm khiến gương mặt thiếu sức sống.\n\n## Má hồng đánh chếch lên\n\nĐánh từ gò má kéo chếch về thái dương giúp khuôn mặt nâng và thon hơn so với đánh tròn ở giữa má.\n\n## Kiểu tóc phù hợp\n\nTóc phồng nhẹ ở đỉnh đầu và vài lọn mái dài hai bên giúp kéo dài tỉ lệ mặt, nên tránh búi quá sát mặt.", "cta": "cd"}, {"title": "Cô Dâu Nên Thử Layout Makeup Trước Ngày Cưới Bao Lâu?", "description": "Lời khuyên từ Master Lý Hoàng giúp bạn chọn đúng layout và an tâm tuyệt đối.", "thumbnail": "anh/makeup-trong-treo-han-quoc-vay-ren-toc-nua-bup-bien-hoa.webp", "body": "Thử layout là bước quan trọng giúp cô dâu an tâm trước ngày trọng đại.\n\n## Thời điểm lý tưởng\n\nNên thử trước ngày cưới từ 2–4 tuần để còn thời gian điều chỉnh tóc, phụ kiện và màu son nếu cần.\n\n## Buổi thử gồm những gì\n\nSoi da, phân tích dáng mặt, đánh thử nền để kiểm tra độ bền, chọn dáng mi, màu mắt, son và chụp ảnh lưu file màu.\n\n## Mang gì đến buổi thử\n\nẢnh layout yêu thích, hình váy cưới hoặc áo dài và phụ kiện cài tóc dự định dùng để Master tư vấn đồng bộ.", "cta": "cd"}, {"title": "Bí Quyết Chọn Tông Son Hoàn Hảo Theo Màu Váy Cưới", "description": "Chọn son ăn ý với váy trắng, đỏ, áo dài và giữ màu bền suốt tiệc.", "thumbnail": "anh/makeup-tiec-su-kien-vay-do-toc-bup-cao-bien-hoa.webp", "body": "Màu son nên ăn ý với trang phục để tổng thể hài hòa và nổi bật.\n\n## Váy cưới trắng\n\nSon hồng đào hoặc cam hồng cho vẻ trong trẻo; son đỏ gạch nếu muốn nét sang trọng.\n\n## Áo dài đỏ truyền thống\n\nSon đỏ cherry hoặc đỏ đất giúp tông xuyệt tông, làm nổi làn da sáng.\n\n## Giữ son bền cả buổi tiệc\n\nĐánh lót son, thấm bớt dầu rồi tán một lớp son mỏng thứ hai; mang theo son mini để dặm lại.", "cta": "cd"}, {"title": "Mới Bắt Đầu Học Makeup Cần Chuẩn Bị Những Gì?", "description": "Dụng cụ và mỹ phẩm cần thiết, tiết kiệm chi phí.", "thumbnail": "anh/khong-gian-tiem-ly-hoang-makeup-bien-hoa.webp", "body": "Người mới học không cần mua quá nhiều. Hãy bắt đầu từ những món thật sự cần thiết.\n\n## Cọ cơ bản\n\nMột cọ nền, một cọ phấn, cọ mắt đa năng và cọ má hồng là đủ cho giai đoạn đầu.\n\n## Mỹ phẩm nền tảng\n\nKem lót, nền phù hợp tông da, che khuyết điểm, phấn phủ, má hồng và son màu trung tính.\n\n## Học cùng Master\n\nỞ khóa Makeup Cá Nhân 1:1, mỹ phẩm được hỗ trợ tại lớp nên bạn chưa cần đầu tư lớn trước khi biết mình hợp gì.", "cta": "hv"}, {"title": "Cách Xử Lý Lớp Nền Bị Mốc Nứt Cực Nhanh Cho Da Khô Và Dầu", "description": "Khắc phục nền cakey, nứt rãnh cười; dưỡng da tiền makeup chuẩn.", "thumbnail": "anh/makeup-douyin-tan-nhang-toc-den-dai-bien-hoa.webp", "body": "Nền bị mốc thường do da thiếu ẩm hoặc dùng quá nhiều sản phẩm.\n\n## Cấp ẩm đúng cách\n\nDa khô cần serum cấp ẩm và kem dưỡng đủ ẩm; da dầu dùng gel ẩm mỏng để nền không bị trôi hay vón.\n\n## Đánh nền mỏng từng lớp\n\nDặm từng lớp nhỏ, tập trung vùng cần che thay vì phủ dày toàn mặt, đặc biệt quanh rãnh cười.\n\n## Cách cứu nền\n\nXịt khoáng nhẹ, ấn bông ẩm lên vùng mốc rồi dặm lại bằng một lớp nền rất mỏng.", "cta": "cd"}, {"title": "Trang Điểm Tiệc Tại Nhà Hay Tại Tiệm: Lựa Chọn Nào Tối Ưu?", "description": "So sánh ưu nhược điểm, bảng giá minh bạch.", "thumbnail": "anh/lam-toc-song-voi-nang-trong-treo-ly-hoang-makeup-bien-hoa.webp", "body": "Cả hai lựa chọn đều ổn, tùy vào thời gian và độ thoải mái của bạn.\n\n## Tại tiệm 300.000đ\n\nKhông gian ánh sáng chuẩn, đồ nghề đầy đủ, giá tốt hơn.\n\n## Tại nhà 350.000đ\n\nTiện lợi khi cần chuẩn bị sớm hoặc đi cùng gia đình, tiết kiệm thời gian di chuyển.\n\n## Gợi ý\n\nĐi một mình nên chọn tại tiệm; đi nhóm hoặc sự kiện sớm nên chọn tại nhà.", "cta": "cd"}, {"title": "3 Kiểu Tóc Cô Dâu Đơn Giản, Sang Trọng Xu Hướng Mới Nhất", "description": "Phù hợp lễ gia tiên và tiệc tối, dễ kết hợp phụ kiện.", "thumbnail": "anh/toc-song-voi-vong-hoa-co-dau-tone-tay-bien-hoa.webp", "body": "Kiểu tóc đơn giản vẫn có thể rất sang nếu hợp dáng mặt và phụ kiện.\n\n## Tóc sóng nhẹ thả dài\n\nHợp lễ gia tiên và ảnh cưới, mềm mại, tôn gương mặt trong trẻo.\n\n## Búi thấp cài hoa\n\nGọn gàng, thanh lịch, kết hợp voan hoặc phụ kiện lá cài nổi bật.\n\n## Tóc nửa búi\n\nCân bằng giữa nữ tính và hiện đại, phù hợp tiệc tối.", "cta": "cd"}, {"title": "Lộ Trình Phục Hồi Da Cho Cô Dâu Trước Ngày Cưới 2 Tuần", "description": "Cấp ẩm, chăm sóc da 14 ngày để nền makeup hoàn hảo.", "thumbnail": "anh/makeup-trong-treo-han-quoc-ao-dai-trang-bien-hoa.webp", "body": "Làn da khỏe là nền móng của lớp makeup hoàn hảo, nên bắt đầu chăm da từ 14 ngày trước.\n\n## Tuần 1: làm sạch và cấp ẩm\n\nRửa mặt dịu nhẹ, dùng serum cấp ẩm và mặt nạ phục hồi 2 lần mỗi tuần.\n\n## Tuần 2: giữ ổn định\n\nKhông thử sản phẩm mới, không lột tẩy hay lấy nhân mụn gần ngày cưới.\n\n## Ngủ đủ và uống đủ nước\n\nGiấc ngủ 7–8 tiếng và uống nhiều nước giúp da căng bóng tự nhiên.", "cta": "cd"}, {"title": "Hướng Dẫn Kỹ Thuật Kẻ Mắt Eyeliner Cho Người Mới Bắt Đầu", "description": "Kẻ eyeliner tự nhiên, mở góc mắt Douyin dễ làm.", "thumbnail": "anh/makeup-douyin-mat-nhu-bien-long-mi-ma-hong-bien-hoa.webp", "body": "Kẻ mắt đẹp bắt đầu từ việc hiểu dáng mắt của mình.\n\n## Chọn bút kẻ dễ dùng\n\nBút gel hoặc bút nước đầu nhỏ giúp người mới dễ kiểm soát nét.\n\n## Kẻ sát chân mi, vuốt nhẹ\n\nKẻ từng đoạn ngắn rồi nối lại, đuôi mắt vuốt nhẹ lên để mở góc mắt kiểu Douyin.\n\n## Luyện tập đều\n\nThực hành trên khuôn mặt thật cùng Master giúp sửa nét ngay tại chỗ.", "cta": "hv"}, {"title": "Cách Trang Điểm Chụp Kỷ Yếu Bền Màu, Ăn Ảnh Suốt Cả Ngày", "description": "Makeup kỷ yếu trong trẻo, bền dưới nắng, giá tốt tại Biên Hòa.", "thumbnail": "anh/makeup-ky-yeu-dong-phuc-hoc-sinh-bien-hoa.webp", "body": "Makeup kỷ yếu cần trong trẻo, bền màu và ăn ảnh dưới ánh nắng.\n\n## Nền mỏng, bền\n\nDùng kem lót kiềm dầu, nền mỏng nhẹ và xịt khóa nền để chịu được nóng ẩm.\n\n## Tông màu tươi\n\nMá hồng đào, son gradient và mắt nhẹ giúp gương mặt tươi tắn trong ảnh.\n\n## Giá tại Biên Hòa\n\nDịch vụ makeup kỷ yếu / chụp ảnh tại tiệm: 350.000đ, đã gồm làm tóc.", "cta": "cd"}], "shop": [], "look": [{"title": "Trong trẻo Hàn Quốc kết hợp nắn chỉnh nét Douyin", "images": ["anh/makeup-trong-treo-han-quoc-vay-ren-toc-nua-bup-bien-hoa.webp", "anh/makeup-trong-treo-han-quoc-ao-dai-trang-bien-hoa.webp", "anh/lam-toc-song-voi-nang-trong-treo-ly-hoang-makeup-bien-hoa.webp", "anh/makeup-ky-yeu-ao-dai-trang-toc-xoan-bien-hoa.webp", "anh/makeup-ao-dai-hong-toc-xoan-vang-bien-hoa.webp", "anh/makeup-trong-treo-ao-dai-trang-hoa-ly-bien-hoa.webp"]}, {"title": "Douyin sắc sảo thời thượng", "images": ["anh/makeup-douyin-tan-nhang-toc-den-dai-bien-hoa.webp", "anh/makeup-douyin-mat-nhu-bien-long-mi-ma-hong-bien-hoa.webp", "anh/ function md(s){
  s = String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;');
  var inl = function(x){ return x.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\[(.+?)\]\((.+?)\)/g, '<a class="gold" href="$2">$1</a>'); };
  return s.split(/\n{2,}/).map(function(b){
    b = b.trim(); if(!b) return '';
    var h = b.match(/^(#{1,3})\s+(.*)/);
    if(h){ var l = h[1].length + 1; return '<h' + l + ' style="font-size:' + (l == 2 ? 24 : 20) + 'px;margin-top:28px">' + inl(h[2]) + '</h' + l + '>'; }
    var tableLines=b.split('\n').map(function(x){return x.trim()}).filter(Boolean);
    if(tableLines.length>1&&tableLines[1].split('|').filter(Boolean).every(function(x){return /^\s*:?-{3,}:?\s*$/.test(x)})){
      var cells=function(line){return line.replace(/^\|/,'').replace(/\|$/,'').split('|').map(function(x){return inl(x.trim())})};
      var head=cells(tableLines[0]),body=tableLines.slice(2).map(cells);
      return '<div style="overflow-x:auto;margin:18px 0"><table><thead><tr>'+head.map(function(x){return '<th>'+x+'</th>'}).join('')+'</tr></thead><tbody>'+body.map(function(row){return '<tr>'+head.map(function(_,i){return '<td>'+(row[i]||'')+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>';
    }
    if(/^[-*]\s+/.test(b)) return '<ul>' + b.split('\n').map(function(x){ return '<li>' + inl(x.replace(/^[-*]\s+/, '')) + '</li>'; }).join('') + '</ul>';
    var im = b.match(/^!\[(.*?)\]\((.*?)(?:\s+"(.*)")?\)/);
    if(im){ var cap = im[3] ? '<figcaption class="c mute" style="font-size:13px;margin-top:6px">' + im[3] + '</figcaption>' : ''; return '<figure style="margin:18px 0"><img class="im im16" src="' + bimg(im[2]) + '" alt="' + im[1] + '" loading="lazy">' + cap + '</figure>'; }
    return '<p>' + inl(b).replace(/\n/g, '<br>') + '</p>';
  }).join('');
}

<div class="lb-switch"><a class="${isV?'':'on'}" href="${cat?'/lookbook/hinh-anh/'+cat.s+'/':'/lookbook/hinh-anh/'}">Hình ảnh</a><a class="${isV?'on':''}" href="${cat?'/lookbook/video/'+cat.s+'/':'/lookbook/video/'}">Video</a></div></div>
<div class="lb-bar"><div class="lb-pills">${pills}</div>${subHtml}</div><label class="lb-search"><span class="mute" style="font-size:12px">Tìm theo nội dung hoặc hashtag</span><input id="lbsq" type="search" placeholder="Ví dụ: #tonecamdao, mặt tròn, cô dâu..." oninput="lbF()"></label>
<p class="lb-count" id="lbc"></p><div class="${isV?'lb-vg':'lb-pg'}" id="lbg">${grid}</div>${list.length?'':empty}
<p class="c"><button type="button" class="btn b2" id="lbm" onclick="lbMore()" style="display:none">Xem thêm</button></p>
<div class="lb-cta rv"><p>Thích layout nào? Gửi mình ảnh hoặc tên layout, tiệm tư vấn và giữ lịch cho bạn.</p><a class="btn" href="/dat-lich/?cd">Đặt lịch makeup</a> <a class="btn b2" href="${Z}" target="_blank" rel="noopener">Nhắn Zalo</a></div></div></div>`}
function lookPath(p){var m=String(p).match(/^\/lookbook\/(hinh-anh|video)(?:\/([^/]+))?\/?$/);if(!m)return lookHub();return lookPage(m[1]=='video'?'video':'photo',m[2]||'')}
function lbF(){var g=document.getElementById('lbg');if(!g)return;var it=g.children,n=0,shown=0,q=slug((document.getElementById('lbsq')||{}).value||'');
for(var i=0;i<it.length;i++){var c=it[i],ok=(lbSub=='all'||c.getAttribute('data-sub')==lbSub)&&(!q||(c.getAttribute('data-k')||'').indexOf(q)>-1);
if(ok){n++;if(shown<lbLim){c.hidden=false;shown++}else c.hidden=true}else c.hidden=true}
var e=document.getElementById('lbc');if(e)e.textContent=n?('Đang hiển thị '+shown+' / '+n+(lbKind=='video'?' video':' ảnh')):'';
var m=document.getElementById('lbm');if(m)m.style.display=n>shown?'inline-block':'none'}
function lbSubSel(b){lbSub=b.getAttribute('data-sub')||'all';lbLim=24;document.querySelectorAll('.lb-sp').forEach(x=>x.classList.toggle('on',x===b));lbF()}
function lbMore(){lbLim+=24;lbF()}
var lbCur=-1,lbList=[];
function lbBox(){var b=document.getElementById('lbx');if(b)return b;b=document.createElement('div');b.id='lbx';b.className='lbx';b.hidden=true;
b.innerHTML='<button type="button" class="lbx-x" aria-label="Đóng" onclick="lbClose()">×</button><button type="button" class="lbx-p" aria-label="Ảnh trước" onclick="lbStep(-1)">‹</button><div class="lbx-m" id="lbxm"></div><button type="button" class="lbx-n" aria-label="Ảnh sau" onclick="lbStep(1)">›</button><div class="lbx-c" id="lbxc"></div>';
b.addEventListener('click',function(e){if(e.target===b||e.target.id=='lbxm')lbClose()});
var sx=0;b.addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});b.addEventListener('touchend',function(e){var d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50&&lbList.length>1)lbStep(d<0?1:-1)});
document.addEventListener('keydown',function(e){if(b.hidden)return;if(e.key=='Escape')lbClose();else if(e.key=='ArrowLeft')lbStep(-1);else if(e.key=='ArrowRight')lbStep(1)});
document.body.appendChild(b);return b}
function lbShow(i){var a=lbList[i];if(!a)return;lbCur=i;var t=a.getAttribute('data-t')||'',d=a.getAttribute('data-d')||'',tags=a.getAttribute('data-tags')||'';
document.getElementById('lbxm').innerHTML='<img src="'+a.getAttribute('href')+'" alt="'+esc(t)+'">'+(t?'<p><b>'+esc(t)+'</b></p>':'')+(d?'<p>'+esc(d).replace(/\n/g,'<br>')+'</p>':'')+(tags?'<p class="gold">'+esc(tags)+'</p>':'');
document.getElementById('lbxc').textContent=(i+1)+' / '+lbList.length}
function lbOpen(a,e){if(e&&(e.metaKey||e.ctrlKey||e.shiftKey))return true;if(e)e.preventDefault();var b=lbBox();
lbList=Array.prototype.filter.call(document.querySelectorAll('#lbg .lbi'),x=>!x.hidden);b.hidden=false;document.body.classList.add('lb-lock');lbShow(lbList.indexOf(a));return false}
function lbStep(d){if(!lbList.length)return;lbShow((lbCur+d+lbList.length)%lbList.length)}
function lbClose(){var b=document.getElementById('lbx');if(!b)return;b.hidden=true;document.body.classList.remove('lb-lock');var m=document.getElementById('lbxm');if(m)m.innerHTML=''}
function lbPlay(btn){var s=btn.getAttribute('data-src'),t=btn.getAttribute('data-t')||'',em=lbEmbed(s);
if(em.t=='link'){window.open(em.u,'_blank','noopener');return}
var b=lbBox();lbList=[];b.hidden=false;document.body.classList.add('lb-lock');
var inner=em.t=='iframe'?'<iframe src="'+em.u+'" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="'+esc(t)+'"></iframe>':'<video src="'+esc(em.u)+'" controls autoplay playsinline></video>',d=btn.getAttribute('data-d')||'',tags=btn.getAttribute('data-tags')||'';
document.getElementById('lbxm').innerHTML='<div class="lbx-v">'+inner+'</div>'+(t?'<p><b>'+esc(t)+'</b></p>':'')+(d?'<p>'+esc(d).replace(/\n/g,'<br>')+'</p>':'')+(tags?'<p class="gold">'+esc(tags)+'</p>':'');document.getElementById('lbxc').textContent=''}
function lookbook(){return lookHub()}

function applyCfg(){Z=SV('zalo_url')||Z;var zl=$('#zlf');if(zl)zl.href=Z;var t=SV('hotline_tel');ctas=`<a class="btn" href="${Z}" target="_blank">Nhắn Tin Zalo</a> <a class="btn b2" href="tel:${t}">Gọi Hotline</a>`;applyHeader();renderFooter()}
function boot(){
extra();addEventListener('popstate',route);document.addEventListener('click',function(e){if(e.defaultPrevented||e.metaKey||e.ctrlKey||e.shiftKey||e.button)return;var a=e.target.closest&&e.target.closest('a');if(!a)return;var h=a.getAttribute('href');if(!h||h.charAt(0)!=='/'||h.charAt(1)==='/'||a.target||h.indexOf('/admin')==0)return;e.preventDefault();history.pushState(null,'',h);route()});fab();rc();
var F=[['site','/data/site.json'],['home','/data/home.json'],['price','/data/price.json'],['blog','/data/blog.json'],['shop','/data/shop.json'],['look','/data/look.json'],['lookv','/data/lookvideo.json'],['rules','/data/rules.json']];
Promise.all(F.map(function(f){return fetch(f[1]+'?v='+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null).then(function(j){
if(!j||typeof j!=='object'){CFG[f[0]]=null;return}
CFG[f[0]]=f[0]=='blog'?(Array.isArray(j.posts)?j.posts:null):f[0]=='shop'?(Array.isArray(j.products)?j.products:null):f[0]=='rules'?(Array.isArray(j.rules)?j.rules:null):j})})).then(function(){applyCfg();rebuildShop();route()})}
if(window.netlifyIdentity)netlifyIdentity.on('init',u=>{if(!u)netlifyIdentity.on('login',()=>{location.href='/admin/'})});

function curPath(){var p=location.pathname||'/';p=p.replace(/index\.html$/,'').replace(/\/+$/,'');return p||'/'}
function LK(h){return String(h).replace(/href="#\/([^"]*)"/g,function(m,x){var q='',i=x.indexOf('?');if(i>-1){q=x.slice(i);x=x.slice(0,i)}x=x.replace(/\/+$/,'');return 'href="/'+(x?x+'/':'')+q+'"'})}
function slug(s){return String(s||'').toLowerCase().replace(/đ/g,'d').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}
function seoMeta(p){var m=(window.__SEO||{})[p];if(!m)return;document.title=m.t;var d=document.querySelector('meta[name=description]');if(d)d.setAttribute('content',m.d);var c=document.querySelector('link[rel=canonical]');if(c)c.setAttribute('href',m.u)}
function banner(){var s=PV('service_banner');return s?`<img src="${s}" alt="${esc(PV('service_banner_alt')||'Lý Hoàng Makeup Artist')}" fetchpriority="high" style="display:block;width:100%;aspect-ratio:2056/765;object-fit:cover;border-radius:22px;margin:0 0 28px">`:''}
function wait(n){return `<div class="w"><div class="in" style="max-width:520px"><h1>${n}</h1><p class="mute">Khóa sắp mở. Để lại thông tin để vào danh sách chờ.</p>${form('hv')}</div></div>`}
const B=[['Kỹ Thuật Trang Điểm Cô Dâu Mặt Tròn: Bí Quyết Thon Gọn Tự Nhiên','Cách tạo khối cốt tướng và phối kiểu tóc giúp nàng dâu tỏa sáng ngày cưới.'],['Cô Dâu Nên Thử Layout Makeup Trước Ngày Cưới Bao Lâu?','Lời khuyên từ Master Lý Hoàng giúp bạn chọn đúng layout và an tâm tuyệt đối.'],['Bí Quyết Chọn Tông Son Hoàn Hảo Theo Màu Váy Cưới','Chọn son ăn ý với váy trắng, đỏ, áo dài và giữ màu bền suốt tiệc.'],['Mới Bắt Đầu Học Makeup Cần Chuẩn Bị Những Gì?','Dụng cụ và mỹ phẩm cần thiết, tiết kiệm chi phí.'],['Cách Xử Lý Lớp Nền Bị Mốc Nứt Cực Nhanh Cho Da Khô Và Dầu','Khắc phục nền cakey, nứt rãnh cười; dưỡng da tiền makeup chuẩn.'],['Trang Điểm Tiệc Tại Nhà Hay Tại Tiệm: Lựa Chọn Nào Tối Ưu?','So sánh ưu nhược điểm, bảng giá minh bạch.'],['3 Kiểu Tóc Cô Dâu Đơn Giản, Sang Trọng Xu Hướng Mới Nhất','Phù hợp lễ gia tiên và tiệc tối, dễ kết hợp phụ kiện.'],['Lộ Trình Phục Hồi Da Cho Cô Dâu Trước Ngày Cưới 2 Tuần','Cấp ẩm, chăm sóc da 14 ngày để nền makeup hoàn hảo.'],['Hướng Dẫn Kỹ Thuật Kẻ Mắt Eyeliner Cho Người Mới Bắt Đầu','Kẻ eyeliner tự nhiên, mở góc mắt Douyin dễ làm.'],['Cách Trang Điểm Chụp Kỷ Yếu Bền Màu, Ăn Ảnh Suốt Cả Ngày','Makeup kỷ yếu trong trẻo, bền dưới nắng, giá tốt tại Biên Hòa.']];
const S=[['LH-BRUSH-01','Bộ Cọ Trang Điểm Chuyên Nghiệp Lý Hoàng (14 Cây)',1250000,'Lông thú tự nhiên & bionic, cán gỗ khắc laser Master Lý Hoàng.','<rect x="40" y="10" width="10" height="70" rx="5" fill="url(#g0)"/><path d="M30 10Q45-8 60 10Z" fill="#6e5f3e"/>'],['LH-SPONGE-01','Bông Mút Tán Nền Kháng Khuẩn Ruby Cell',120000,'Ngậm nước đa chiều, đàn hồi cao, tán nền tiệp da.','<ellipse cx="45" cy="50" rx="26" ry="32" fill="url(#g1)"/>'],['LH-SPRAY-01','Xịt Khóa Nền Cố Định 16 Giờ Ultra Matte',380000,'Tia sương nano, kiềm dầu, chống lem trôi dưới thời tiết nóng ẩm.','<rect x="30" y="28" width="30" height="55" rx="8" fill="url(#g2)"/><rect x="38" y="10" width="14" height="18" fill="#6e5f3e"/>'],['LH-COLOR-01','Bảng Kem Triệt Sắc & Che Khuyết Điểm Pro Palette',450000,'6 ô màu cân chỉnh chuẩn sắc tố da châu Á.','<rect x="10" y="20" width="70" height="50" rx="8" fill="url(#g3)"/><circle cx="28" cy="38" r="8" fill="#f3e6bd"/><circle cx="48" cy="38" r="8" fill="#e6b9a0"/><circle cx="66" cy="38" r="8" fill="#c98f6b"/>']];
function add(i){cartL.push(i);rc();openCart()}function openCart(){cart.classList.add('o')}
function rc(){$('#cc').textContent=cartL.length;$('#ci').innerHTML=cartL.length?cartL.map(i=>`<p>${S[i][1]}<br><b class="gold">${S[i][2].toLocaleString('vi-VN')}đ</b></p>`).join('')+`<p><b>Tổng: ${cartL.reduce((a,i)=>a+S[i][2],0).toLocaleString('vi-VN')}đ</b></p>`:'<p class="mute">Giỏ trống</p>'}
function route(){
if(location.hash.indexOf('#/')==0){var hh=location.hash.slice(1),q='',i=hh.indexOf('?');if(i>-1){q=hh.slice(i);hh=hh.slice(0,i)}history.replaceState(null,'',(hh.replace(/\/+$/,'')||'')+'/'+q)}
var p=curPath(),h;
if(p === '/blog' || p === '/blog/'){
    h = blog();
  } else if(p.indexOf('/blog/') === 0){
    h = post(decodeURIComponent(p.slice(6).replace(/^\/+|\/+$/g, '')));
  } else if(p === '/cua-hang' || p === '/cua-hang/'){
    h = shop();
  } else if(p.indexOf('/cua-hang/') === 0){
    h = product(decodeURIComponent(p.slice(10).replace(/^\/+|\/+$/g, '')));
  } else if(p.indexOf('/lookbook/') === 0){
    h = lookPath(p);
  } else {
    h = (P[p] || P['/'])();
  }
$('#app').innerHTML=LK(h);if(typeof lbF==='function')lbF();
nav.classList.remove('o');
document.querySelectorAll('nav a').forEach(a=>{var x=a.getAttribute('href');a.classList.toggle('on',p=='/'?x=='/':(x=='/'+p.replace(/^\//,'').replace(/\/$/,'')+'/')||(x=='/lookbook/'&&p.indexOf('/lookbook')==0))});
seoMeta(p);
if(!keep)scrollTo(0,0);keep=0;initV();applyRules($('#app'));applyRules($('header'))}
boot();
</script>
